spring:
  application:
    name: qihang-shops
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/qihang_shop?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
    username: root
    password: Andy_123
    hikari:
      maximum-pool-size: 10
      min-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      # Redis 密码为空时留空即可
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: cn.qihangerp.api.domain

server:
  port: 8098

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# 小店管家配置
qihang:
  # 头像存储目录（相对路径以进程工作目录为基准）
  avatar-path: ./upload/avatar

# JWT 配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌秘钥（生产环境请务必修改为自己生成的随机串）
  secret: qihangshops0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcde
  # 令牌有效期（默认30分钟）
  expireTime: 30
